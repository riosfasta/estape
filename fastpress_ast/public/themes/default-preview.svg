  <rect x="380" y="42" width="36" height="8" rx="4" fill="#64748b"/>
  <rect x="496" y="36" width="60" height="20" rx="4" fill="#ff5e3a"/>

  <!-- Hero Content -->
  <rect x="60" y="100" width="120" height="14" rx="4" fill="#ff5e3a" fill-opacity="0.9"/>
