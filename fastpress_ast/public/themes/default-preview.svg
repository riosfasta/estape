  <rect x="410" y="100" width="140" height="135" rx="8" fill="#161e2e" stroke="#253248"/>
  <rect x="426" y="116" width="108" height="60" rx="4" fill="#202c42"/>
  <rect x="426" y="186" width="80" height="10" rx="3" fill="#f8fafc"/>
  <rect x="426" y="202" width="50" height="8" rx="3" fill="#64748b"/>

  <!-- Feature Grid 3 Columns -->
  <rect x="40" y="265" width="160" height="105" rx="8" fill="#111724" stroke="#1f293d"/>
  <circle cx="64" cy="290" r="12" fill="#ff5e3a" fill-opacity="0.2"/>
  <rect x="84" y="286" width="80" height="10" rx="3" fill="#f8fafc"/>
  <rect x="52" y="310" width="136" height="8" rx="3" fill="#64748b"/>
  <rect x="52" y="324" width="100" height="8" rx="3" fill="#475569"/>

  <rect x="220" y="265" width="160" height="105" rx="8" fill="#111724" stroke="#1f293d"/>
