  <rect x="264" y="286" width="80" height="10" rx="3" fill="#f8fafc"/>
  <rect x="232" y="310" width="136" height="8" rx="3" fill="#64748b"/>
  <rect x="232" y="324" width="100" height="8" rx="3" fill="#475569"/>

  <rect x="400" y="265" width="160" height="105" rx="8" fill="#111724" stroke="#1f293d"/>
  <circle cx="424" cy="290" r="12" fill="#10b981" fill-opacity="0.2"/>
