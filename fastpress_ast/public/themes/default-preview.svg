  <rect width="600" height="400" fill="#0b0f19"/>
  
  <!-- Subtle decorative gradients -->
  <circle cx="500" cy="80" r="160" fill="#ff5e3a" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="140" fill="#6366f1" fill-opacity="0.10" filter="blur(40px)"/>
  
  <!-- Top bar -->
  <rect x="24" y="24" width="552" height="44" rx="8" fill="#131926" stroke="#1f293d"/>
  <rect x="44" y="38" width="68" height="16" rx="4" fill="#ff5e3a"/>
  <rect x="230" y="42" width="36" height="8" rx="4" fill="#64748b"/>
  <rect x="280" y="42" width="36" height="8" rx="4" fill="#64748b"/>
